schema_version: "2"
name: gradebot_hw
description: Grade one assignment's submissions against a rubric, with per-student evidence.

inputs:
  submissions_dir:
    type: path
    required: false
    default: submissions
    description: Directory of student .py submissions
  rubric_file:
    type: path
    required: false
    default: rubric.md
    description: The rubric the grader applies verbatim
  output_dir:
    type: path
    required: false
    default: feedback
    description: Where per-student feedback files land
  summary_file:
    type: path
    required: false
    default: grades/summary.md
    description: Where the batch summary report lands

models:
  grader:
    model: test
    settings: {}

steps:
  - name: collect_submissions
    component: python
    config:
      script: scripts/collect_submissions.py
    inputs:
      submissions_dir: inputs.submissions_dir
      output_dir: inputs.output_dir

  - name: read_rubric
    component: file_read
    config:
      path: inputs.rubric_file
      format: text

  - name: run_tests
    component: shell
    each: steps.collect_submissions.output.submissions
    config:
      command:
        - uv
        - run
        - python
        - scripts/run_submission_tests.py
      parse_stdout: json
    inputs:
      submission_path: item.path

  - name: read_submission
    component: file_read
    each: steps.collect_submissions.output.submissions
    config:
      path: item.path
      format: text

  - name: grade
    component: llm
    each: steps.collect_submissions.output.submissions
    config:
      model: grader
      prompt: prompts/grade_submission.md
      output_schema:
        type: object
        properties:
          score:
            type: integer
            minimum: 0
            maximum: 100
          comments:
            type: string
          feedback_markdown:
            type: string
        required:
          - score
          - comments
          - feedback_markdown
      max_validation_retries: 2
    inputs:
      rubric: steps.read_rubric.content
      submission: steps.read_submission.content
      test_output: steps.run_tests.stdout

  - name: check_grades
    component: assertions
    each: steps.collect_submissions.output.submissions
    config:
      checks:
        - input: score
          op: gte
          expected: 0
        - input: score
          op: lte
          expected: 100
    inputs:
      score: steps.grade.output.score

  - name: write_feedback
    component: file_write
    each: steps.collect_submissions.output.submissions
    config:
      path: item.feedback_path
      format: markdown
    inputs:
      content: steps.grade.output.feedback_markdown

  - name: summarize
    component: python
    config:
      script: scripts/summarize_grades.py
    inputs:
      submissions: steps.collect_submissions.output.submissions
      grades: steps.grade.output
      test_results: steps.run_tests.stdout

  - name: write_summary
    component: file_write
    config:
      path: inputs.summary_file
      format: markdown
    inputs:
      content: steps.summarize.output.report_markdown

settings:
  concurrency: 2
  max_failures: 5
  max_failure_rate: 0.25

outputs:
  grades: steps.grade.output
  summary_stats: steps.summarize.output.stats
